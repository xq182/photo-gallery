<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f2">
  <meta name="description" content="照片与编号。">
  <meta name="robots" content="noindex, nofollow">
  <title>照片</title>
  <link rel="stylesheet" href="./styles.css?v=2">
  <script src="./app.js?v=2" defer></script>
</head>
<body>
  <main id="archive" aria-label="照片">
    <div id="photo-grid" class="photo-grid" aria-busy="true"></div>
    <p id="error-state" role="alert" hidden>照片加载失败，请刷新重试。</p>
    <noscript>请开启 JavaScript 以查看照片。</noscript>
  </main>
  <dialog id="lightbox" aria-labelledby="lightbox-id">
    <button id="close-lightbox" aria-label="关闭大图">
      <img id="lightbox-image" alt="">
      <span id="lightbox-id"></span>
    </button>
  </dialog>
</body>
</html>
